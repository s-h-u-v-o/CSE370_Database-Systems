<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club-Collab Sign Up</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        
    <link rel="stylesheet" href="css/login_modern.css?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <i class="fa-solid fa-users-gear"></i>
                <h1>Club-Collab</h1>
                <p>Create a New Account</p>
            </div>

            <form id="signupForm" class="login-form signup-compact">
                <!-- Name and Email -->
                <div class="form-row-2">
                    <div class="form-group">
                        <label>Full Name</label>
                        <div class="input-group">
                            <i class="fa-solid fa-user"></i>
                            <input type="text" id="signupName" name="name" placeholder="Enter your full name" required />
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <div class="input-group">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" id="signupEmail" name="email" placeholder="Enter your email" required />
                        </div>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="signupPassword" name="password" placeholder="Create a password (min 8 characters)" required minlength="8" />
                    </div>
                </div>

                <!-- Address -->
                <div class="form-row-3">
                    <div class="form-group">
                        <label>Street</label>
                        <div class="input-group">
                            <i class="fa-solid fa-location-dot"></i>
                            <input type="text" id="signupStreet" name="street" placeholder="Street address" required />
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Sub-district</label>
                        <div class="input-group">
                            <i class="fa-solid fa-map-pin"></i>
                            <input type="text" id="signupSubDistrict" name="sub_district" placeholder="Sub-district" required />
                        </div>
                    </div>

                    <div class="form-group">
                        <label>District</label>
                        <div class="input-group">
                            <i class="fa-solid fa-map"></i>
                            <input type="text" id="signupDistrict" name="district" placeholder="District" required />
                        </div>
                    </div>
                </div>

                <!-- Phone -->
                <div class="form-group">
                    <label>Phone Number (11 digits)</label>
                    <div class="input-group">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" id="signupPhone" name="phone" placeholder="Enter 11-digit phone number" required pattern="[0-9]{11}" />
                    </div>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fa-solid fa-user-plus"></i> Sign Up
                </button>
            </form>

            <div style="text-align: center; margin-top: 1rem;">
                <p style="color: var(--text-secondary); font-size: 0.875rem;">Already have an account? <a href="login.html">Login here</a></p>
            </div>
        </div>
    </div>

    <script src="js/signup.js"></script>
</body>
</html>
